<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>交互预览</title>
<script>
  // This document stays opaque and keeps its response CSP when replaced.
  const origin = new URL(location.href).origin;
  addEventListener('message', event => {
    if (event.source !== parent || event.origin !== origin || event.data?.type !== 'zigent:interactive:document'
      || typeof event.data.html !== 'string' || event.data.html.length > 128 * 1024) return;
    document.open();
    document.write(event.data.html);
    document.close();
  });
  parent.postMessage({ type: 'zigent:interactive:document-ready' }, origin);
</script>
</html>
