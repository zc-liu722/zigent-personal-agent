<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Zigent · 交互工坊</title><link rel="stylesheet" href="/studio.css"><script type="module" src="/studio.js"></script></head>
<body>
<header class="masthead"><a class="wordmark" href="/">z<span>交互工坊</span></a><span class="local-mark"><i></i>LOCAL / WORKING TREE</span><div class="global-actions"><span id="pending-count">无待保存改动</span><button id="discard-all" class="quiet" type="button" disabled>撤销全部</button><button id="save-all" class="primary" type="button" disabled>全部保存</button></div></header>
<div class="layout"><aside class="catalogue"><div class="catalogue-heading"><span>组件场景</span><span id="scene-count"></span></div><input id="search" type="search" placeholder="搜索场景" aria-label="搜索组件场景"><nav id="scenes" aria-label="组件场景"></nav><footer><span id="connection"><i></i>正在连接</span><button id="refresh" type="button" class="text-control">刷新 ↻</button></footer></aside>
<main><div class="component-heading"><div><span id="scene-group" class="eyebrow">COMPONENT STUDIO</span><h1 id="scene-name">选择组件</h1></div><div class="component-actions"><span id="component-state"></span><button id="resolve-conflicts" type="button" class="quiet" hidden>AI 重新合并</button><button id="discard" type="button" class="quiet" disabled>撤销此项</button><button id="save" type="button" class="primary" disabled>保存此项</button></div></div>
<div class="controls"><label>状态<select id="status"><option value="original">场景默认</option><option value="pending">待操作</option><option value="completed">完成</option><option value="failed">失败</option><option value="expired">过期</option><option value="cancelled">取消</option></select></label><label>视口<select id="viewport"><option value="390">手机 · 390</option><option value="768">平板 · 768</option><option value="1100">桌面 · 1100</option><option value="fluid">自适应</option></select></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>模拟响应<select id="response"><option value="success">成功</option><option value="failure">失败</option><option value="slow">延迟</option></select></label><button id="replay" type="button" class="text-control">重放交互 ↻</button></div>
<div id="feedback" class="feedback" role="status" hidden></div>
<div class="comparison"><section class="pane"><header><span class="pane-index">01</span><h2>更改前</h2><span class="pane-meta">当前源码</span></header><div class="stage" id="stage-before"></div><p id="error-before" class="pane-error" hidden></p></section><section class="pane after"><header><span class="pane-index">02</span><h2>更改后</h2><span class="pane-meta" id="draft-state">草稿预览</span></header><div class="stage" id="stage-after"></div><p id="error-after" class="pane-error" hidden></p></section></div>
<section id="ai-panel" class="chat-panel" aria-label="Codex 组件对话"><header class="chat-heading"><div><span class="eyebrow">GPT / KIMI</span><h2 id="chat-component">选择组件</h2></div><span id="chat-status" role="status">正在连接模型</span><button id="chat-connect" type="button" class="text-control">连接模型 ↗</button></header><div id="chat-messages" class="chat-messages" role="log" aria-label="组件对话" hidden></div><div class="chat-progress"><span id="chat-activity" role="status"></span><span id="chat-usage"></span></div><p id="chat-error" class="pane-error" role="alert" hidden></p><div class="chat-composer"><textarea id="instruction" rows="3" placeholder="描述你想怎样修改当前组件…" aria-label="给模型的组件修改要求"></textarea><div class="chat-toolbar"><label>模型<select id="chat-model" aria-label="Codex 模型" disabled></select></label><label>思考<select id="chat-effort" aria-label="Codex 思考强度" disabled></select></label><div class="chat-send-actions"><button id="copy-prompt" type="button" class="text-control">复制要求</button><button id="chat-stop" type="button" class="quiet" hidden>停止</button><button id="chat-send" type="button" class="primary" disabled>发送 ↗</button></div></div></div></section>
<div class="workbench-details"><details id="draft-panel"><summary><span>草稿目录</span><span>↗</span></summary><div class="draft-path"><code id="draft-path"></code><button id="copy-path" type="button" class="text-control">复制路径</button></div><textarea id="prompt-fallback" readonly rows="8" hidden aria-label="AI 修改指令"></textarea></details>
<details id="code-panel"><summary><span>源码改动 <span id="file-count">0</span></span><span>↗</span></summary><div class="code-toolbar"><select id="file" aria-label="组件源码文件"></select><button id="reload-file" class="text-control" type="button">重新加载</button><button id="update-draft" class="quiet" type="button" disabled>更新草稿</button></div><div class="code-comparison"><textarea id="code-before" readonly spellcheck="false" aria-label="当前源码"></textarea><textarea id="code-after" spellcheck="false" aria-label="草稿源码"></textarea></div></details>
<details id="events-panel"><summary><span>操作记录</span><span>↗</span></summary><pre id="events"></pre></details></div>
</main></div>
</body></html>
