[package]
name = "zigent-terminal"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
[lib]
doctest = false
[dependencies]
anyhow = "1"
portable-pty = "=0.9.0"
libc = "0.2.182"
tokio = { version = "=1.52.3", features = ["io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
filedescriptor = "=0.8.3"
lazy_static = "1.5"
log = "0.4"
shared_library = "=0.1.9"
winapi = { version = "=0.3.9", features = ["std", "handleapi", "jobapi", "jobapi2", "libloaderapi", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt"] }
