[package]
name = "zigent-execution"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
zigent-terminal = { path = "../terminal" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.52.3", features = ["io-util", "io-std", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "=0.3.9", features = ["handleapi", "processthreadsapi", "securitybaseapi", "winnt"] }
